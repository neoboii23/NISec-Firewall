# Database + Studio subset of Supabase. No public Data API, Auth or Storage.
name: nisec-studio
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.167
    restart: unless-stopped
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the startup script}
      POSTGRES_DB: postgres
      PGPORT: 5432
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 30
  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
  studio:
    image: public.ecr.aws/supabase/studio:2026.08.24-sha-8ec45b2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    ports:
      - "127.0.0.1:54323:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: NISec Laboratory
      DEFAULT_PROJECT_NAME: ORIGINE and Sentinel
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLIC_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_IS_PLATFORM: "false"
      ENABLED_FEATURES_LOGS_ALL: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/platform/profile').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database:
