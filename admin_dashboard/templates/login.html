<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Sentinel WAF</title><link rel="stylesheet" href="{{ url_for('static',filename='css/dashboard.css') }}"></head><body class="login-screen"><main class="login-card"><a class="brand" href="/"><span class="shield">S</span><span>SENTINEL<small>WAF ADMINISTRATION</small></span></a><span class="eyebrow">SECURE WORKSPACE</span><h1>Welcome back.</h1><p>Sign in to monitor and manage your firewall.</p>{% for message in get_flashed_messages() %}<div class="notice">{{ message }}</div>{% endfor %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button class="primary" type="submit">Sign in to dashboard <span>→</span></button></form><small class="login-note">Administrator access only · Separate from storefront accounts</small></main></body></html>
