{% extends 'base.html' %}{% block title %}Edit profile{% endblock %}{% block content %}<section class="form-page"><span class="eyebrow">Account details</span><h1>Edit profile.</h1><form method="post"><label>EMAIL</label><input name="email" type="email" value="{{ g.user.email }}" required><label>FULL NAME</label><input name="full_name" value="{{ g.user.full_name }}"><label>BIO</label><textarea name="bio">{{ g.user.bio }}</textarea><label>NEW PASSWORD <small>(leave empty to keep current)</small></label><input name="password" type="password"><button>Save changes</button></form></section>{% endblock %}
